<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Hover Effect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f5f5;
    }

    .product-card {
      width: 240px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      text-align: center;
      transition: all 0.3s ease;
    }

    .product-card img {
      width: 100%;
      transition: all 0.4s ease;
    }

    .product-card:hover img {
      opacity: 0.9;
    }

    /* ---------- icon group ---------- */
    .icon-group {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .icon-group a {
      width: 35px;
      height: 35px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .icon-group a:hover {
      background: #000;
      color: #fff;
    }

    .product-card:hover .icon-group {
      opacity: 1;
      transform: translateY(0);
    }

    /* ---------- quickview box ---------- */
    .quickview {
      position: absolute;
      bottom: -45px;
      left: 0;
      width: 100%;
      background: #3b3b3b;
      color: #fff;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 0;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .product-card:hover .quickview {
      bottom: 0;
    }

    /* ---------- content section ---------- */
    .product-info {
      padding: 15px 10px;
    }

    .product-name {
      font-size: 15px;
      color: #222;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .rating {
      color: #ccc;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 18px;
      font-weight: 600;
      color: #000;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

  <div class="product-card">
    <img src="https://static.nike.com/a/images/t_prod_ss/w_960,c_limit,f_auto/64b2e1db-3678-40a8-8bc8-3dc58fd43a50/converse-chuck-quarter-socks-3-pairs.png" alt="Socks">

    <div class="icon-group">
      <a href="#"><i class="fa-regular fa-heart"></i></a>
      <a href="#"><i class="fa-solid fa-chart-simple"></i></a>
      <a href="#"><i class="fa-solid fa-bag-shopping"></i></a>
    </div>

    <div class="quickview">Quickview</div>

    <div class="product-info">
      <div class="product-name">Converse Chuck Quarter</div>
      <div class="rating">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>
      <div class="product-price">$14.00</div>
    </div>
  </div>

</body>
</html>
